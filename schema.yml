  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      description: |-
        Login endpoint: Authenticates user and returns JWT access/refresh tokens,
        user details, and tenant memberships.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      description: 'Logout endpoint: Blacklists refresh token to revoke session.'
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: v1_auth_me_retrieve
      description: |-
        GET /api/v1/auth/me/
        Returns:
        - user profile
        - active tenant context
        - tenant role
        - granular permissions
        - enabled modules/features
      tags:
      - v1
      security:
