  /api/v1/contracts/:
    get:
      operationId: v1_contracts_list
      description: |-
        Base ViewSet for all tenant-scoped resources in OmniCore.
        Guarantees:
        1. Automatic tenant isolation in get_queryset().
        2. Prevention of cross-tenant data leakage via get_object().
        3. Automatic tenant attribution in perform_create().
        4. Integration of RBAC, Feature Entitlement, and Tenant Status enforcement.
      parameters:
      - in: query
        name: customer
        schema:
          type: string
          format: uuid
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACTIVE
          - DRAFT
          - EXPIRED
          - PENDING_APPROVAL
          - RENEWAL_DUE
          - TERMINATED
        description: |-
          * `DRAFT` - Draft
          * `PENDING_APPROVAL` - Pending Legal/Finance Approval
          * `ACTIVE` - Active Execution
          * `RENEWAL_DUE` - Renewal Due
          * `EXPIRED` - Expired
          * `TERMINATED` - Terminated
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedContractList'
          description: ''
