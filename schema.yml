openapi: 3.0.3
info:
  title: OmniCore Logistics & Fleet Ecosystem API
  version: 1.0.0
  description: Production-ready, multi-tenant enterprise backend for modern logistics,
    fleet operations, contracts, and finance.
paths:
  /api/v1/addons/:
    get:
      operationId: v1_addons_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAddonList'
          description: ''
  /api/v1/addons/{id}/:
    get:
      operationId: v1_addons_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this addon.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Addon'
          description: ''
  /api/v1/audit/:
    get:
      operationId: v1_audit_list
      description: |-
        Immutable audit trail view.
        Platform admins can view all logs; tenant managers can view tenant-scoped logs.
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: target_id
        schema:
          type: string
      - in: query
        name: target_type
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/v1/audit/{id}/:
    get:
      operationId: v1_audit_retrieve
      description: |-
        Immutable audit trail view.
        Platform admins can view all logs; tenant managers can view tenant-scoped logs.
