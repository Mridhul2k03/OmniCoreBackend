          - CANCELLED
          - DELIVERED
          - DELIVERY_ATTEMPTED
          - DELIVERY_FAILED
          - DESTINATION_HUB
          - IN_TRANSIT
          - OUT_FOR_DELIVERY
          - PICKED_UP
          - PICKUP_ASSIGNED
          - PICKUP_IN_PROGRESS
          - RETURNED
          - SORTED
          - SORTING
          - SORTING_PENDING
        description: |-
          * `BOOKED` - Booked
          * `PICKUP_ASSIGNED` - Pickup Assigned
          * `PICKUP_IN_PROGRESS` - Pickup In Progress
          * `PICKED_UP` - Picked Up
          * `AT_HUB` - Arrived at Origin Hub
          * `SORTING_PENDING` - Sorting Pending
          * `SORTING` - In Sorting
          * `SORTED` - Sorted
          * `IN_TRANSIT` - Line-Haul In Transit
          * `DESTINATION_HUB` - Arrived at Destination Hub
          * `OUT_FOR_DELIVERY` - Out for Delivery
          * `DELIVERY_ATTEMPTED` - Delivery Attempted
          * `DELIVERED` - Delivered
          * `DELIVERY_FAILED` - Delivery Failed
          * `RETURNED` - Returned to Origin / RTO
          * `CANCELLED` - Cancelled
